name: Scraping Albo – Chrome headless
on:
  schedule:
    - cron: "15 18 * * *"   # 18:15 UTC ogni giorno
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install latest Google Chrome & system deps
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-liberation libnss3 libgconf-2-4 libxss1 libasound2
          sudo mount -o remount,size=1G /dev/shm
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install webdriver-manage
      
      - name: Run scraper
        run: python scraper_stateless.py
      
      - name: Debug - Check files
        run: |
          echo "=== Directory structure ==="
          find pdfs -type f 2>/dev/null | head -20 || echo "No pdfs folder"
          echo ""
          echo "=== Metadata ==="
          cat metadata.json 2>/dev/null || echo "No metadata.json"
          echo ""
          echo "=== Git status ==="
          git status
      
      - name: Commit and push PDF files
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add pdfs/ metadata.json
          git commit -m "📄 Atti scaricati $(date +%Y-%m-%d_%H:%M:%S)" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
